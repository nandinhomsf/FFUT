# Carrega variaveis locais do arquivo .env (nao versionado). Ver .env.example.
spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:FFUT}

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=always

application.domain=${APPLICATION_DOMAIN:http://localhost:8080}
frontend.domain=${FRONTEND_DOMAIN:http://localhost:4200/#}
frontend.url=${FRONTEND_URL:http://localhost:4200/#/}

spring.mvc.dispatch-options-request=true

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ffut}

springdoc.api-docs.path=/api-docs
springdoc.default-produces-media-type=application/json

spring.security.jwt.expiration=${JWT_EXPIRATION:1440}
spring.security.jwt.signature-key=${JWT_SIGNATURE_KEY}

resend.enabled=${RESEND_ENABLED:false}
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}
resend.api-url=${RESEND_API_URL:https://api.resend.com}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:tuff}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
